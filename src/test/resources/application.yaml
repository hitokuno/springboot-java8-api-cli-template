# Test-only configuration: overrides main application.yaml
# Uses H2 in-memory DB (Oracle compatibility mode) and disables SSL.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

mybatis:
  mapper-locations: classpath:mybatis/primary/*.xml
  configuration:
    map-underscore-to-camel-case: false

server:
  port: 0
  ssl:
    enabled: false
